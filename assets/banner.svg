<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulse-ring {
      0% { r: 120px; opacity: 0.15; }
      50% { r: 145px; opacity: 0.35; }
      100% { r: 120px; opacity: 0.15; }
    }
    @keyframes float-badge-1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes float-badge-2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-1deg); }
    }
    @keyframes flow-path {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes status-blink {
      0%, 100% { opacity: 1; fill: #10b981; }
      50% { opacity: 0.4; fill: #34d399; }
    }
    @keyframes scan-line {
      0% { transform: translateY(-40px); opacity: 0; }
      30% { opacity: 0.6; }
      70% { opacity: 0.6; }
      100% { transform: translateY(280px); opacity: 0; }
    }

    .pulse-circle { animation: pulse-ring 6s infinite ease-in-out; transform-origin: 1040px 180px; }
    .badge-float-1 { animation: float-badge-1 5s infinite ease-in-out; }
    .badge-float-2 { animation: float-badge-2 6s infinite ease-in-out; }
    .animated-wire { stroke-dasharray: 12 8; animation: flow-path 14s linear infinite; }
    .status-dot { animation: status-blink 2s infinite ease-in-out; }
    .scanner { animation: scan-line 4s infinite linear; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bg-glow)" />

  <!-- Grid Pattern Overlay in Background -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.18">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />

    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
  </g>

  <!-- Dynamic Animated Background Streams & Circuits -->
  <g opacity="0.45">
    <path class="animated-wire" d="M 600 40 Q 820 40 920 130 T 1150 140" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-wire" d="M 500 320 Q 750 310 880 230 T 1160 220" fill="none" stroke="#818cf8" stroke-width="2" style="animation-direction: reverse;" />
    <path class="animated-wire" d="M 700 360 C 800 280 840 80 1020 70" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Radar / Ambient Energy in Right Background (Away from Title) -->
  <circle cx="1040" cy="180" r="130" class="pulse-circle" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="1040" cy="180" r="85" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.3" />
  <circle cx="1040" cy="180" r="45" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.4" />

  <!-- Floating Dynamic Compliance Telemetry Cards (Positioned in Right Background) -->
  <g class="badge-float-1" transform="translate(870, 50)">
    <rect width="250" height="66" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)"/>
    <circle cx="24" cy="33" r="6" class="status-dot" />
    <text x="40" y="28" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">CONTINUOUS CONTROL</text>
    <text x="40" y="49" fill="#f8fafc" font-size="14" font-weight="700">SOC 2 Type II: 100% Valid</text>
  </g>

  <g class="badge-float-2" transform="translate(890, 150)">
    <rect width="240" height="66" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)"/>
    <rect x="18" y="22" width="22" height="22" rx="5" fill="#818cf8" fill-opacity="0.2" />
    <path d="M 24 33 L 28 37 L 35 28" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="28" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">EVIDENCE PIPELINE</text>
    <text x="50" y="49" fill="#f8fafc" font-size="14" font-weight="700">Autonomous Sync Active</text>
  </g>

  <g class="badge-float-1" transform="translate(860, 248)">
    <rect width="260" height="66" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)"/>
    <circle cx="24" cy="33" r="6" fill="#10b981" />
    <text x="40" y="28" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">AUDIT READINESS GATE</text>
    <text x="40" y="49" fill="#34d399" font-size="14" font-weight="700">Zero Drift Detected</text>
  </g>

  <!-- Laser / Scanner Effect over card region -->
  <g transform="translate(850, 40)" opacity="0.6">
    <line class="scanner" x1="0" y1="0" x2="290" y2="0" stroke="url(#primary-grad)" stroke-width="2" />
  </g>

  <!-- FOREGROUND: Clear, High-Contrast Typography & Core Identity -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" class="status-dot" />
      <text x="30" y="21" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">AUTONOMOUS COMPLIANCE 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Autonomous
    </text>
    <text x="0" y="196" font-size="42" font-weight="800" fill="url(#primary-grad)" letter-spacing="-0.5">
      SOC 2 Compliance Managers
    </text>

    <!-- Subtitle & Description -->
    <text x="0" y="244" font-size="17" font-weight="400" fill="#cbd5e1" opacity="0.95">
      Curated ecosystem of SaaS leaders &amp; open-source automation frameworks
    </text>
    <text x="0" y="272" font-size="15" font-weight="500" fill="#94a3b8">
      ⚡ Continuous Control Monitoring &nbsp;•&nbsp; 🛡️ Automated Evidence &nbsp;•&nbsp; 🚀 Audit-Ready Posture
    </text>

    <!-- Framework Tags/Pills -->
    <g transform="translate(0, 302)">
      <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="14" y="17" fill="#e2e8f0" font-size="12" font-weight="600">SOC 2</text>

      <rect x="95" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="108" y="17" fill="#e2e8f0" font-size="12" font-weight="600">ISO 27001</text>

      <rect x="210" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="224" y="17" fill="#e2e8f0" font-size="12" font-weight="600">HIPAA</text>

      <rect x="300" y="0" width="75" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="314" y="17" fill="#e2e8f0" font-size="12" font-weight="600">GDPR</text>

      <rect x="385" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="398" y="17" fill="#e2e8f0" font-size="12" font-weight="600">NIST 800-53</text>
    </g>
  </g>
</svg>
